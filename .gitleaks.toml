# KeepItClean gitleaks configuration
# Uses gitleaks default ruleset (AWS / GitHub / Slack / private keys / etc).

[extend]
useDefault = true

[allowlist]
description = "KeepItClean fixture allowlist"

# Test fixtures and mock binaries never hold real secrets.
paths = [
    '''Tests/.*''',
]

# Security documentation names protected credential classes without embedding
# any real credential value.
regexes = [
    '''credentials, sessions, databases''',
]
